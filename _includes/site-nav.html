{% assign profile = site.data.profile %}
<div class="page-header">
  <header class="header--fixed">
    <nav class="navbar" id="navbar-main">
      <div class="container">
        <a class="navbar-brand" href="{{ '/' | relative_url }}">{{ profile.name | default: site.name }}</a>

        <button type="button" class="navbar-toggler" aria-controls="navbar-content"
                aria-expanded="false" aria-label="Toggle navigation">
          <i class="fas fa-bars" aria-hidden="true"></i>
        </button>

        <div class="navbar-collapse" id="navbar-content">
          <ul class="navbar-nav">
            {% for item in site.data.navigation.main %}
              <li class="nav-item">
                <a class="nav-link" href="{% if item.url contains '://' %}{{ item.url }}{% else %}{{ item.url | relative_url }}{% endif %}"
                   {% if item.new_tab or item.url contains '://' %}target="_blank" rel="noopener"{% endif %}>
                  <span>{{ item.title }}</span>
                </a>
              </li>
            {% endfor %}
          </ul>
        </div>

        <ul class="navbar-nav nav-icons">
          <li class="nav-item theme-dropdown">
            <button type="button" class="theme-toggle" aria-haspopup="true" aria-expanded="false"
                    aria-label="Display preferences">
              <i class="fas fa-moon" aria-hidden="true"></i>
            </button>
            <div class="dropdown-menu">
              <button type="button" class="dropdown-item" data-set-theme="light">Light</button>
              <button type="button" class="dropdown-item" data-set-theme="dark">Dark</button>
              <button type="button" class="dropdown-item" data-set-theme="auto">Automatic</button>
            </div>
          </li>
        </ul>
      </div>
    </nav>
  </header>
</div>
