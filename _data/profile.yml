# Profile card shown in the About section of the homepage.
# Edit this file to change your name, photo, and social links.

name: "Drew Prinster"

# Optional subtitle lines under your name. Left blank to match the reference
# layout, which shows the name only. Fill either in to have it appear.
role: ""          # e.g. "PhD Student in Computer Science"
